name: sync-ngit

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-ngit
  cancel-in-progress: false

jobs:
  sync:
    name: Sync master to ngit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: danconwaydev/setup-ngit@v3
        with:
          version: "3.0.3"

      - name: Sync master to ngit
        env:
          NGIT_NBUNKSEC: ${{ secrets.NGIT_NBUNKSEC }}
        run: |
          set -euo pipefail
          nbunksec="${NGIT_NBUNKSEC//[$' \t\r\n']/}"
          if [[ "$nbunksec" != nbunksec1* ]]; then
            echo "NGIT_NBUNKSEC must be an nbunksec from the repository owner" >&2
            exit 1
          fi
          umask 077
          key_file="$RUNNER_TEMP/ngit-nbunksec"
          printf '%s' "$nbunksec" > "$key_file"
          git remote add nostr "nostr://npub193tl2rc9veyrgfs4zce4jfg7h9gtd9v03tqegq0mzxgf3vwx605sm8e5kc/git.wgtunnel.com/wgtunnel-android"
          git config nostr.trust-server-domains github.com
          ngit --nbunksec-file "$key_file" sync --defaults --trust-server --ref-name master --repo nostr
